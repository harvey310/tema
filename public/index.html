<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1677ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>分析看板</title>
  <style>
    :root {
      --primary: #1677ff;
      --primary-hover: #4096ff;
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #1f1f1f;
      --muted: #8c8c8c;
      --border: #d9d9d9;
      --success: #52c41a;
      --danger: #ff4d4f;
      --blue: #1677ff;
      --green: #52c41a;
      --red: #ff4d4f;
      --warning-bg: #fff7e6;
      --warning-border: #ffd591;
    }
    * { box-sizing: border-box; }
	    body {
	      margin: 0;
	      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
	      color: var(--text);
	      background: var(--bg);
	      line-height: 1.5;
	      -webkit-text-size-adjust: 100%;
	      overflow-x: hidden;
	    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: #fff;
      border-bottom: 1px solid #f0f0f0;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
    }
    h2 {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 650;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 650;
    }
    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      align-items: start;
    }
    .grid {
      display: grid;
      gap: 16px;
    }
    .grid.cards {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .card {
      background: var(--card);
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,.03);
    }
    .metric .label {
      color: var(--muted);
      font-size: 13px;
    }
    .metric .value {
      margin-top: 8px;
      font-size: 28px;
      font-weight: 700;
    }
    .metric .sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }
	    .toolbar {
	      display: flex;
	      flex-wrap: wrap;
	      gap: 8px;
	      align-items: center;
	    }
	    .header-row {
	      display: flex;
	      align-items: center;
	      justify-content: space-between;
	      gap: 12px;
	      width: 100%;
	    }
	    .data-strip {
	      display: flex;
	      flex-wrap: wrap;
	      gap: 6px;
	      width: 100%;
	    }
	    .data-strip .tag {
	      height: 28px;
	      font-size: 13px;
	    }
	    .reset-small {
	      min-height: 32px;
	      height: 32px;
	      flex: 0 0 auto;
	      padding: 4px 10px;
	      border-color: #ffccc7;
	      background: #fff1f0;
	      color: #cf1322;
	      font-size: 13px;
	      white-space: nowrap;
	    }
	    .header-actions {
	      display: flex;
	      gap: 8px;
	      align-items: center;
	      flex: 0 0 auto;
	    }
	    .version-button {
	      min-height: 32px;
	      height: 32px;
	      flex: 0 0 auto;
	      padding: 4px 10px;
	      border-color: #91caff;
	      background: #e6f4ff;
	      color: #0958d9;
	      font-size: 13px;
	      white-space: nowrap;
	    }
	    .version-popover {
	      display: none;
	      width: 100%;
	      padding: 10px;
	      border: 1px solid #d9d9d9;
	      border-radius: 8px;
	      background: #fff;
	    }
	    .version-popover.open {
	      display: block;
	    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid #f0f0f0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab {
      padding: 10px 14px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: #595959;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }
    button, .file-label {
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 4px 15px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      transition: all .2s;
    }
    button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }
    button.primary:hover {
      border-color: var(--primary-hover);
      background: var(--primary-hover);
    }
    button.danger {
      color: var(--danger);
      border-color: #ffccc7;
    }
    input, select, textarea {
      width: 100%;
      min-height: 36px;
      padding: 5px 11px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    textarea {
      min-height: 78px;
      resize: vertical;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary-hover);
      box-shadow: 0 0 0 2px rgba(5,145,255,.12);
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #595959;
      font-size: 13px;
    }
    .form-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .notice {
      margin-bottom: 16px;
      padding: 10px 12px;
      border: 1px solid var(--warning-border);
      border-radius: 8px;
      background: var(--warning-bg);
      color: #874d00;
      font-size: 13px;
    }
    .top-filter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding: 16px 20px;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      background: #fff;
    }
    .top-filter .filter-title {
      font-size: 15px;
      font-weight: 650;
    }
    .top-filter .filter-control {
      width: 180px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 4px;
      font-size: 12px;
      border: 1px solid #d9d9d9;
      background: #fafafa;
      color: #595959;
      white-space: nowrap;
    }
    .tag.red { color: #cf1322; border-color: #ffa39e; background: #fff1f0; }
    .tag.blue { color: #0958d9; border-color: #91caff; background: #e6f4ff; }
    .tag.green { color: #389e0d; border-color: #b7eb8f; background: #f6ffed; }
    .tag.neutral { color: #595959; border-color: #d9d9d9; background: #fafafa; }
    .status-list {
      display: grid;
      gap: 10px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 56px 1fr 42px;
      gap: 10px;
      align-items: center;
      font-size: 13px;
      margin: 8px 0;
    }
    .bar-bg {
      height: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: #f0f0f0;
    }
    .bar {
      height: 100%;
      border-radius: 99px;
      background: var(--primary);
    }
    .bar.red { background: var(--red); }
    .bar.blue { background: var(--blue); }
    .bar.green { background: var(--green); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid #f0f0f0;
      text-align: left;
      vertical-align: middle;
    }
    th {
      color: #595959;
      background: #fafafa;
      font-weight: 600;
    }
    tr:hover td { background: #fafafa; }
    .table-wrap {
      overflow: auto;
      max-height: 520px;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .table-wrap table {
      min-width: 760px;
    }
    #referencePanel .table-wrap table {
      min-width: 520px;
    }
    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .analysis-card {
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      padding: 14px;
      background: #fff;
    }
    .analysis-card strong {
      font-size: 22px;
    }
    .kv {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 6px;
      margin-top: 10px;
      font-size: 13px;
    }
    .kv span:nth-child(odd) {
      color: var(--muted);
    }
    .muted {
      color: var(--muted);
      font-size: 13px;
    }
    .hidden { display: none; }
    .danger-text { color: var(--danger); }
    .success-text { color: var(--success); }
    .record-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin: 12px 0;
    }
    .footer-note {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
    }
    .inline-tags {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }
    .reference-table td {
      line-height: 1.8;
    }
    .number-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 24px;
      margin: 2px 4px 2px 0;
      border-radius: 4px;
      font-size: 12px;
      border: 1px solid #d9d9d9;
      background: #fafafa;
    }
    .number-chip.red { color: #cf1322; border-color: #ffa39e; background: #fff1f0; }
    .number-chip.blue { color: #0958d9; border-color: #91caff; background: #e6f4ff; }
    .number-chip.green { color: #389e0d; border-color: #b7eb8f; background: #f6ffed; }
	    .duplicate-row td {
	      background: #fffbe6 !important;
	    }
	    .result-list {
	      display: grid;
	      gap: 10px;
	      margin-top: 16px;
	    }
	    .number-card {
	      overflow: hidden;
	      border: 1px solid #f0f0f0;
	      border-radius: 8px;
	      background: #fff;
	    }
	    .number-card.warn {
	      border-color: #ffe58f;
	      background: #fffbe6;
	    }
	    .number-card-head {
	      display: flex;
	      align-items: flex-start;
	      justify-content: space-between;
	      gap: 8px;
	      padding: 12px;
	      border-bottom: 1px solid #f0f0f0;
	    }
	    .number-title {
	      display: flex;
	      flex-wrap: wrap;
	      gap: 6px;
	      align-items: center;
	      min-width: 0;
	    }
	    .number-code {
	      font-size: 22px;
	      line-height: 1;
	      font-weight: 700;
	    }
	    .number-meta {
	      display: inline-flex;
	      flex-wrap: wrap;
	      gap: 4px;
	      align-items: center;
	    }
	    .number-money {
	      flex: 0 0 auto;
	      text-align: right;
	      font-size: 12px;
	      color: var(--muted);
	    }
	    .number-money strong {
	      display: block;
	      color: var(--text);
	      font-size: 16px;
	    }
	    .detail-grid {
	      display: grid;
	      grid-template-columns: repeat(2, minmax(0, 1fr));
	      gap: 1px;
	      background: #f0f0f0;
	    }
	    .detail-item {
	      min-width: 0;
	      padding: 9px 10px;
	      background: #fff;
	    }
	    .number-card.warn .detail-item {
	      background: #fffdf0;
	    }
	    .detail-label {
	      color: var(--muted);
	      font-size: 12px;
	    }
	    .detail-value {
	      margin-top: 2px;
	      color: var(--text);
	      font-size: 14px;
	      font-weight: 600;
	      word-break: break-word;
	    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .45);
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal {
      width: min(560px, 100%);
      max-height: calc(100vh - 40px);
      overflow: auto;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid #f0f0f0;
    }
    .modal-header h2 {
      margin: 0;
    }
    .modal-body {
      padding: 20px;
    }
    .icon-button {
      width: 32px;
      min-width: 32px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
    }
    @media (max-width: 1120px) {
      .layout { grid-template-columns: 1fr; }
      .grid.cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      body { background: #fff; }
      header {
        position: static;
        height: auto;
        min-height: 56px;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 16px;
        flex-direction: column;
      }
      h1 { font-size: 18px; }
      h2 { font-size: 17px; }
      h3 { font-size: 14px; }
      main { padding: 12px; }
      .card {
        padding: 14px;
        border-radius: 8px;
        box-shadow: none;
      }
      .notice {
        margin-bottom: 12px;
        font-size: 12px;
      }
      .top-filter {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 12px;
        padding: 14px;
      }
      .top-filter .filter-control {
        width: 100%;
      }
      .layout {
        gap: 12px;
      }
      .grid {
        gap: 12px;
      }
      .grid.cards, .grid.two, .analysis-grid, .form-row { grid-template-columns: 1fr; }
      .grid.cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .grid.cards .card {
        padding: 12px;
      }
      .metric .value {
        font-size: 16px;
        line-height: 1.25;
        word-break: break-word;
      }
      .metric .label,
      .metric .sub {
        font-size: 12px;
      }
	    .toolbar {
	      width: 100%;
	      gap: 6px;
	    }
	    .header-row {
	      align-items: center;
	    }
	    .reset-small {
	      width: auto;
	      min-width: 76px;
	      flex: 0 0 auto;
	    }
      button, .file-label {
        min-height: 40px;
        flex: 1;
      }
      input, select, textarea {
        min-height: 40px;
        font-size: 16px;
      }
      textarea {
        min-height: 112px;
      }
      .tabs {
        margin: -2px -14px 14px;
        padding: 0 14px;
      }
      .tab {
        min-height: 42px;
        padding: 10px 10px;
      }
      .record-actions {
        flex-direction: column;
        align-items: stretch;
      }
      .record-actions input {
        max-width: none !important;
      }
      .bar-row {
        grid-template-columns: 54px minmax(0, 1fr) 64px;
        gap: 8px;
      }
      .kv {
        grid-template-columns: 76px 1fr;
      }
      .table-wrap {
        max-height: none;
      }
      .modal-backdrop {
        align-items: flex-end;
        padding: 0;
      }
      .modal {
        width: 100%;
        max-height: 92vh;
        border-radius: 12px 12px 0 0;
      }
      .modal-header,
      .modal-body {
        padding: 14px;
      }
    }
    @media (max-width: 420px) {
      .tag {
        max-width: 100%;
      }
      .bar-row {
        grid-template-columns: 48px minmax(0, 1fr) 58px;
        font-size: 12px;
      }
    }
    /* H5 first layout: the product is primarily used on phones. */
    body {
      background: #f5f5f5;
    }
    header {
      position: static;
      height: auto;
      min-height: 56px;
      padding: 12px;
      align-items: flex-start;
      flex-direction: column;
      gap: 10px;
    }
	    main {
	      max-width: 520px;
	      width: 100%;
	      padding: 12px;
	    }
    .layout,
    .grid.two,
    .form-row,
    .analysis-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .grid.cards {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
	    .card {
	      padding: 14px;
	      box-shadow: none;
	      min-width: 0;
	    }
    .metric .value {
      font-size: 16px;
      line-height: 1.25;
    }
    .metric .label,
    .metric .sub {
      font-size: 12px;
    }
    .toolbar {
      width: 100%;
      gap: 6px;
    }
    button,
    .file-label {
      min-height: 40px;
      flex: 1;
    }
    input,
    select,
    textarea {
      min-height: 40px;
      font-size: 16px;
    }
    textarea {
      min-height: 132px;
    }
    .tabs {
      margin: -2px -14px 14px;
      padding: 0 14px;
    }
    .tab {
      min-height: 42px;
      padding: 10px 10px;
    }
    .table-wrap {
      max-height: none;
    }
    .record-actions {
      flex-direction: column;
      align-items: stretch;
    }
    .record-actions input {
      max-width: none !important;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0;
    }
    .summary-item {
      padding: 10px;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      background: #fafafa;
    }
    .summary-item .label {
      color: var(--muted);
      font-size: 12px;
    }
    .summary-item .value {
      margin-top: 4px;
      font-size: 16px;
      font-weight: 650;
      word-break: break-word;
    }
	    .result-block {
	      margin-top: 16px;
	    }
	    @media (max-width: 360px) {
	      .detail-grid {
	        grid-template-columns: 1fr;
	      }
	      .number-card-head {
	        flex-direction: column;
	      }
	      .number-money {
	        width: 100%;
	        text-align: left;
	      }
	    }
	  </style>
</head>
<body>
	  <header>
	    <div class="header-row">
	      <h1>分析看板</h1>
	      <div class="header-actions">
	        <button id="versionBtn" class="version-button">版本信息</button>
	        <button id="updateDataBtn" class="primary">更新数据</button>
	      </div>
	    </div>
	    <div id="versionInfo" class="version-popover">
	      <span class="tag neutral">版本 2026-08-09-worker</span>
	      <span class="tag" id="dataStatus">正在加载共享数据</span>
	    </div>
	  </header>

	  <main>
	    <div id="updateMsg" class="footer-note"></div>
	    <section class="layout">
	      <div class="grid">
	        <div class="card">
	          <div class="tabs">
	            <button class="tab active" data-tab="simulate">投注分析</button>
	            <button class="tab" data-tab="basic">基础信息</button>
	            <button class="tab" data-tab="dashboard">趋势看板</button>
            <button class="tab" data-tab="records">开奖记录</button>
            <button class="tab" data-tab="streak">连续走势</button>
            <button class="tab" data-tab="monthly">月度统计</button>
	            <button class="tab" data-tab="reference">号码参考</button>
	          </div>

	          <div id="basicPanel" class="hidden">
	            <div class="grid cards" id="metrics"></div>
	          </div>

	          <div id="dashboardPanel" class="hidden">
            <div class="grid two">
              <div>
                <h3>特码号码热度</h3>
                <div id="numberHeat"></div>
              </div>
              <div>
                <h3>久未出现号码</h3>
                <div id="coldNumbers"></div>
              </div>
              <div>
                <h3>生肖分布</h3>
                <div id="sxChart"></div>
              </div>
              <div>
                <h3>颜色 / 单双 / 大小</h3>
                <div id="basicChart"></div>
              </div>
              <div>
                <h3>波色未出</h3>
                <div id="colorMiss"></div>
              </div>
              <div>
                <h3>生肖未出</h3>
                <div id="sxMiss"></div>
              </div>
            </div>
          </div>

          <div id="recordsPanel" class="hidden">
            <div class="record-actions">
              <input id="recordSearch" placeholder="搜索期号、日期、号码、生肖" style="max-width: 280px;">
              <button id="openAddModalBtn" class="hidden">新增一期</button>

            <textarea id="balls" placeholder="01馬(红),02蛇(红),03龍(蓝),04兔(蓝),05虎(绿),06牛(绿),07鼠(红)" required></textarea>

  <script>

    const sxOrder = ["马", "蛇", "龙", "兔", "虎", "牛", "鼠", "猪", "狗", "鸡", "猴", "羊"];
    const colorOrder = ["红", "蓝", "绿"];
    const zodiacMap2026 = {
      "马": [1, 13, 25, 37, 49],
      "蛇": [2, 14, 26, 38],
      "龙": [3, 15, 27, 39],
      "兔": [4, 16, 28, 40],
      "虎": [5, 17, 29, 41],
      "牛": [6, 18, 30, 42],
      "鼠": [7, 19, 31, 43],
      "猪": [8, 20, 32, 44],
      "狗": [9, 21, 33, 45],
      "鸡": [10, 22, 34, 46],
      "猴": [11, 23, 35, 47],
      "羊": [12, 24, 36, 48]
    };
    const waveColor2026 = {
      "红": [1, 2, 7, 8, 12, 13, 18, 19, 23, 24, 29, 30, 34, 35, 40, 45, 46],
      "蓝": [3, 4, 9, 10, 14, 15, 20, 25, 26, 31, 36, 37, 41, 42, 47, 48],
      "绿": [5, 6, 11, 16, 17, 21, 22, 27, 28, 32, 33, 38, 39, 43, 44, 49]
    };
    const numberReference2026 = buildNumberReference();
    let records = [];
    let adminAuthenticated = false;

    function parseBall(text) {
      const match = String(text).trim().match(/^(\d{1,2})(.)(?:\((红|蓝|绿)\))$/);
      if (!match) throw new Error("特码格式错误：" + text);
      const num = Number(match[1]);
      if (num < 1 || num > 49) throw new Error("号码必须在 01-49 之间");
      return { raw: pad(num) + match[2] + "(" + match[3] + ")", num, sx: match[2], color: match[3] };
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        credentials: "same-origin",
        ...options,
        headers: {
          ...(options.body ? { "content-type": "application/json" } : {}),
          ...(options.headers || {})
        }
      });
      const body = await response.json();
      if (!response.ok || !body.ok) throw new Error(body.error || "服务请求失败");
      return body.data;
    }

    function toDashboardRecord(record) {
      return {
        period: pad(record.period, 3) + "期",
        date: record.drawDate,
        balls: record.balls,
        special: parseBall(record.balls[6])
      };
    }

    async function loadSharedRecords() {
      const data = await api("/api/records?year=2026");
      records = sortRecords(data.records.map(toDashboardRecord));
      render();
      return data;
    }

    async function loadAdminSession() {
      const data = await api("/api/admin/session");
      adminAuthenticated = Boolean(data.authenticated);
      document.getElementById("openAddModalBtn").classList.toggle("hidden", !adminAuthenticated);
    }

    function normalizePeriod(value) {
      const match = String(value).trim().match(/^0*(\d+)期?$/);
      if (!match) throw new Error("期号格式错误");
      return pad(Number(match[1]), 3) + "期";
    }

    function pad(num, size = 2) {
      return String(num).padStart(size, "0");
    }

    function sortRecords(list) {
      return [...list].sort((a, b) => b.date.localeCompare(a.date) || periodNo(b.period) - periodNo(a.period));
    }

    function periodNo(period) {
      return Number(String(period).replace(/\D/g, ""));
    }

    function countBy(list, getter) {
      const map = new Map();
      list.forEach(item => {
        const key = getter(item);
        map.set(key, (map.get(key) || 0) + 1);
      });
      return [...map.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), "zh-CN"));
    }

    function buildNumberReference() {
      const map = {};
      Object.entries(zodiacMap2026).forEach(([sx, nums]) => {
        nums.forEach(num => {
          const color = Object.entries(waveColor2026).find(([, values]) => values.includes(num))[0];
          map[num] = { sx, color };
        });
      });
      return map;
    }

    function getMissRows(values, list, getter) {
      return values.map(value => {
        const index = list.findIndex(item => getter(item) === value);
        return [value, index === -1 ? list.length : index];
      }).sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), "zh-CN"));
    }

    function recordKey(record) {
      return record.date + "|" + record.period;
    }

    function getSelectedYear() {
      return "2026";
    }

    function getScopedRecords() {
      return records.filter(r => r.date.startsWith("2026-"));
    }

    function getStats() {
      const scopedRecords = getScopedRecords();
      const total = scopedRecords.length;
      const latest = scopedRecords[0];
      const byNum = countBy(scopedRecords, r => pad(r.special.num));
      const bySx = countBy(scopedRecords, r => r.special.sx);
      const byColor = countBy(scopedRecords, r => r.special.color);
      const odd = scopedRecords.filter(r => r.special.num % 2 === 1).length;
      const big = scopedRecords.filter(r => r.special.num >= 25).length;
      const colorMiss = getMissRows(colorOrder, scopedRecords, r => r.special.color);
      const sxMiss = getMissRows(sxOrder, scopedRecords, r => r.special.sx);
      const cold = [];
      for (let i = 1; i <= 49; i++) {
        const num = pad(i);
        const index = scopedRecords.findIndex(r => pad(r.special.num) === num);
        cold.push([num, index === -1 ? total : index]);
      }
      cold.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      return { total, latest, byNum, bySx, byColor, odd, even: total - odd, big, small: total - big, cold, colorMiss, sxMiss };
    }

    function render() {
      const scopedRecords = getScopedRecords();
      const stats = getStats();
      document.getElementById("dataStatus").textContent = getSelectedYear() + " 年 " + scopedRecords.length + " 条 / 总 " + records.length + " 条";
      renderMetrics(stats);
      renderBars("numberHeat", stats.byNum.slice(0, 12));
      renderBars("coldNumbers", stats.cold.slice(0, 12), "期未出");
      renderBars("sxChart", stats.bySx);
      renderBasic(stats);
      renderColorMiss(stats.colorMiss);
      renderBars("sxMiss", stats.sxMiss, "期未出");
      renderRecords();
      renderReference();
      renderStreaks();
      renderMonthly();
    }

    function renderMetrics(stats) {
      const latestText = stats.latest ? stats.latest.period + " " + stats.latest.special.raw : "-";
      const topNum = stats.byNum[0] ? stats.byNum[0][0] + " / " + stats.byNum[0][1] + "次" : "-";
      const coldNum = stats.cold[0] ? stats.cold[0][0] + " / " + stats.cold[0][1] + "期未出" : "-";
      const topSx = stats.bySx[0] ? stats.bySx[0][0] + " / " + stats.bySx[0][1] + "次" : "-";
      document.getElementById("metrics").innerHTML = [
        metric("当前年份期数", stats.total, getSelectedYear() + " 年数据"),
        metric("最新期", latestText, stats.latest ? stats.latest.date : "-"),
        metric("高频号码", topNum, "出现次数最多"),
        metric("久未出现", coldNum, "按最新期倒推"),
        metric("高频生肖", topSx, "特码生肖"),
        metric("波色分布", colorTagList(stats.byColor), "红蓝绿"),
        metric("单双", "单" + stats.odd + " / 双" + stats.even, "特码单双"),
        metric("大小", "大" + stats.big + " / 小" + stats.small, "25-49 为大")
      ].join("");
    }

    function metric(label, value, sub) {
      return `<div class="card metric"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`;
    }

    function renderBars(id, rows, suffix = "次") {
      const max = Math.max(...rows.map(x => x[1]), 1);
      document.getElementById(id).innerHTML = rows.map(([name, count]) => `
        <div class="bar-row">
          <span>${name}</span>
          <div class="bar-bg"><div class="bar" style="width:${count / max * 100}%"></div></div>
          <span>${count}${suffix}</span>
        </div>
      `).join("");
    }

    function renderColorBars(id, rows, suffix = "次") {
      const max = Math.max(...rows.map(x => x[1]), 1);
      document.getElementById(id).innerHTML = rows.map(([name, count]) => `
        <div class="bar-row">
          <span>${colorTag(name, name + "波")}</span>
          <div class="bar-bg"><div class="bar ${colorClass(name)}" style="width:${count / max * 100}%"></div></div>
          <span>${count}${suffix}</span>
        </div>
      `).join("");
    }

    function renderBasic(stats) {
      const colorRows = stats.byColor.map(([name, count]) => ({ name, count, cls: colorClass(name) }));
      const rows = [
        ...colorRows,
        { name: "单", count: stats.odd, cls: "" },
        { name: "双", count: stats.even, cls: "" },
        { name: "大", count: stats.big, cls: "" },
        { name: "小", count: stats.small, cls: "" }
      ];
      const max = Math.max(...rows.map(x => x.count), 1);
      document.getElementById("basicChart").innerHTML = rows.map(row => `
        <div class="bar-row">
          <span>${colorOrder.includes(row.name) ? colorTag(row.name, row.name + "波") : row.name}</span>
          <div class="bar-bg"><div class="bar ${row.cls}" style="width:${row.count / max * 100}%"></div></div>
          <span>${row.count}</span>
        </div>
      `).join("");
    }

    function renderColorMiss(rows) {
      const max = Math.max(...rows.map(x => x[1]), 1);
      document.getElementById("colorMiss").innerHTML = rows.map(([name, count]) => `
        <div class="bar-row">
          <span>${colorTag(name, name + "波")}</span>
          <div class="bar-bg"><div class="bar ${colorClass(name)}" style="width:${count / max * 100}%"></div></div>
          <span>${count}期未出</span>
        </div>
      `).join("");
    }

    function renderRecords() {
      const scopedRecords = getScopedRecords();
      const keyword = document.getElementById("recordSearch").value.trim();
      const rows = keyword ? scopedRecords.filter(r => [r.period, r.date, r.special.raw].join(" ").includes(keyword)) : scopedRecords;
      document.getElementById("recordRows").innerHTML = rows.map((r, index) => {
        const gap = scopedRecords.findIndex(item => recordKey(item) === recordKey(r));
        return `<tr>
          <td>${r.period}</td>
          <td>${r.date}</td>
          <td>${colorTag(r.special.color, r.special.raw)}</td>
          <td>${r.special.num % 2 ? "单" : "双"}</td>
          <td>${r.special.num >= 25 ? "大" : "小"}</td>
          <td>${gap}</td>
        </tr>`;
      }).join("");
    }

    function colorClass(color) {
      return color === "红" ? "red" : color === "蓝" ? "blue" : "green";
    }

    function colorTag(color, label = color) {
      return `<span class="tag ${colorClass(color)}">${label}</span>`;
    }

    function colorTagList(items) {
      return `<span class="inline-tags">${items.map(item => colorTag(item[0], item[0] + item[1])).join("")}</span>`;
    }

    function statusForNumber(count, lastIndex, total) {
      const avg = total / 49;
      if (count === 0) return "历史未出";
      if (lastIndex === 0) return "刚刚出现";
      if (count >= avg * 1.6) return "历史高频";
      if (lastIndex >= Math.max(30, total * 0.25)) return "久未出现";
      return "正常波动";
    }

    function parseAnalysisInput(text) {
      const numbers = [...text.matchAll(/\d{1,2}/g)].map(match => Number(match[0]));
      const zodiacs = [];
      for (const char of text) {
        if (sxOrder.includes(char)) zodiacs.push(char);
      }
      return {
        numbers,
        zodiacs: [...new Set(zodiacs)]
      };
    }

    function parseAmountLine(line) {
      const normalized = line.trim();
      if (!normalized) return null;
      const match = normalized.match(/^(?:各号|每号)?\s*(\d+(?:\.\d+)?)\s*元?$/);
      if (!match) return null;
      if (!/[元号]/.test(normalized)) return null;
      return Number(match[1]);
    }

    function extractBetItems(text) {
      const nums = [...text.matchAll(/\d{1,2}/g)].map(match => Number(match[0]));
      const zodiacs = [];
      for (const char of text) {
        if (sxOrder.includes(char)) zodiacs.push(char);
      }
      const items = [];
      nums.forEach(num => items.push({ num, source: "号码" }));
      zodiacs.forEach(sx => {
        (zodiacMap2026[sx] || []).forEach(num => items.push({ num, source: sx }));
      });
      return items;
    }

    function parseBetPlan(text) {
      const groups = [];
      let pending = [];
      const lines = text.split(/\r?\n/);
      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) continue;
        const amount = parseAmountLine(line);
        if (amount !== null) {
          const content = pending.join("\n").trim();
          if (!content) throw new Error("金额前缺少号码或生肖");
          const items = extractBetItems(content);
          if (!items.length) throw new Error("没有识别到有效号码或生肖：" + content);
          groups.push({ name: "组合" + (groups.length + 1), content, amount, items });
          pending = [];
        } else {
          pending.push(line);
        }
      }
      if (pending.length) throw new Error("存在未设置金额的号码或生肖，请在该组后补充“各号XX元”");
      if (!groups.length) throw new Error("请输入投注内容，例如号码后跟“各号20元”");

      const amountMap = new Map();
      const countMap = new Map();
      const sourceMap = new Map();
      let rawCount = 0;
      for (const group of groups) {
        for (const item of group.items) {
          if (!Number.isInteger(item.num) || item.num < 1 || item.num > 49) {
            throw new Error("号码必须在 01-49 之间");
          }
          rawCount += 1;
          amountMap.set(item.num, (amountMap.get(item.num) || 0) + group.amount);
          countMap.set(item.num, (countMap.get(item.num) || 0) + 1);
          const sources = sourceMap.get(item.num) || [];
          sources.push(item.source + " " + group.amount + "元");
          sourceMap.set(item.num, sources);
        }
      }
      const nums = [...amountMap.keys()].sort((a, b) => a - b);
      const totalInput = [...amountMap.values()].reduce((sum, value) => sum + value, 0);
      const duplicates = nums.filter(num => (countMap.get(num) || 0) > 1);
      const avgAmount = totalInput / Math.max(nums.length, 1);
      const heavyNums = nums.filter(num => amountMap.get(num) > avgAmount);
      return { groups, nums, amountMap, countMap, sourceMap, rawCount, totalInput, duplicates, heavyNums, avgAmount };
    }

    function money(value) {
      const rounded = Math.round(value * 100) / 100;
      return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(2);
    }

    function numTags(nums) {
      return nums.length ? nums.map(num => `<span class="tag neutral">${pad(num)}</span>`).join(" ") : "无";
    }

    function renderSummary(id, items) {
      document.getElementById(id).innerHTML = `<div class="summary-grid">${items.map(item => `
        <div class="summary-item">
          <div class="label">${item.label}</div>
          <div class="value">${item.value}</div>
        </div>
      `).join("")}</div>`;
    }

    function getNumberHistory(num, range = 30) {
      const scopedRecords = getScopedRecords();
      const matched = scopedRecords.filter(r => r.special.num === num);
      const lastIndex = scopedRecords.findIndex(r => r.special.num === num);
      const last = matched[0];
      const recent = scopedRecords.slice(0, range).filter(r => r.special.num === num).length;
      return { matched, lastIndex, last, recent, total: scopedRecords.length };
    }

    function renderBetAdvice(plan, odds, roundLoss, targetProfit) {
      const minAmount = Math.min(...plan.nums.map(num => plan.amountMap.get(num)));
      const maxAmount = Math.max(...plan.nums.map(num => plan.amountMap.get(num)));
      const requiredAmount = (roundLoss + plan.totalInput + targetProfit) / odds;
      const losingNums = plan.nums.filter(num => plan.amountMap.get(num) * odds - plan.totalInput - roundLoss < 0);
      const targetMissNums = plan.nums.filter(num => {
        const pnl = plan.amountMap.get(num) * odds - plan.totalInput - roundLoss;
        return pnl >= 0 && pnl < targetProfit;
      });
      const advice = [];
      if (losingNums.length) {
        advice.push(`有 ${losingNums.length} 个号码命中后仍不能覆盖投入和已亏损，主要是单号金额低于回本要求。`);
      } else {
        advice.push("当前组合下，任一号码命中都可以覆盖本期投入和已亏损。");
      }
      if (targetProfit > 0 && targetMissNums.length) {
        advice.push(`有 ${targetMissNums.length} 个号码命中后未达到目标利润，可降低总投入、减少覆盖号码，或只保留更明确的重仓号码。`);
      }
      if (plan.duplicates.length) {
        advice.push(`重复号码 ${plan.duplicates.length} 个，已自动合并金额；保留重复代表主动重仓，若不是刻意选择，可先剔除重复后再下注。`);
      }
      if (plan.heavyNums.length) {
        advice.push(`重仓号码 ${plan.heavyNums.length} 个，最高单号金额 ${money(maxAmount)}，最低单号金额 ${money(minAmount)}，需要确认这些号码是否值得承担更高投入。`);
      }
      if (plan.nums.length > 32) {
        advice.push("有效覆盖超过 32 个，覆盖面偏宽，容易出现命中但利润被总投入摊薄的情况。");
      } else if (plan.nums.length <= 16) {
        advice.push("有效覆盖在 16 个以内，属于少量号码方案，投入更集中，但容错空间也更小。");
      } else {
        advice.push("有效覆盖在 17-32 个之间，属于中等覆盖方案，需要重点看重复和重仓是否有明确理由。");
      }
      advice.push(`若希望命中即达到当前目标，单个命中号码金额至少约 ${money(requiredAmount)}。`);
      document.getElementById("betAdvice").innerHTML = `
        <strong>投注优化建议</strong>
        <ul style="margin:8px 0 0; padding-left:18px;">
          ${advice.map(item => `<li>${item}</li>`).join("")}
        </ul>
      `;
    }

    function renderSimulation() {
      const odds = Number(document.getElementById("simulateOdds").value || 47);
      const roundLoss = Number(document.getElementById("roundLoss").value || 0);
      const targetProfit = Number(document.getElementById("targetProfit").value || 0);
      const range = Number(document.getElementById("compareRange").value);
      if (!odds || odds <= 0) throw new Error("赔率必须大于0");
      const plan = parseBetPlan(document.getElementById("simulateInput").value);
      const minAmount = Math.min(...plan.nums.map(num => plan.amountMap.get(num)));
      const maxAmount = Math.max(...plan.nums.map(num => plan.amountMap.get(num)));
      const minReward = minAmount * odds;
      const maxReward = maxAmount * odds;
      const requiredAmount = (roundLoss + plan.totalInput + targetProfit) / odds;
      const rows = plan.nums.map(num => {
        const amount = plan.amountMap.get(num);
        const repeatCount = plan.countMap.get(num) || 0;
        const reward = amount * odds;
        const pnl = reward - plan.totalInput - roundLoss;
        const targetPnl = pnl - targetProfit;
        const ref = numberReference2026[num];
        const history = getNumberHistory(num, range);
        const isDuplicate = plan.duplicates.includes(num);
        const state = pnl < 0 ? "中而不赚" : targetPnl < 0 ? "未达目标" : "可盈利";
        const stateClass = state === "可盈利" ? "green" : state === "中而不赚" ? "red" : "blue";
        return `<div class="number-card ${isDuplicate || pnl < 0 ? "warn" : ""}">
          <div class="number-card-head">
            <div class="number-title">
              <span class="number-code">${pad(num)}</span>
              <span class="number-meta">
                <span class="tag neutral">${ref ? ref.sx : "-"}</span>
                ${ref ? colorTag(ref.color, ref.color + "波") : ""}
                ${isDuplicate ? `<span class="tag">重复</span>` : ""}
                <span class="tag ${stateClass}">${state}</span>
              </span>
            </div>
            <div class="number-money">
              投入金额
              <strong>${money(amount)}</strong>
            </div>
          </div>
          <div class="detail-grid">
            <div class="detail-item"><div class="detail-label">重复次数</div><div class="detail-value">${repeatCount}</div></div>
            <div class="detail-item"><div class="detail-label">命中获得</div><div class="detail-value">${money(reward)}</div></div>
            <div class="detail-item"><div class="detail-label">命中盈亏</div><div class="detail-value ${pnl < 0 ? "danger-text" : "success-text"}">${money(pnl)}</div></div>
            <div class="detail-item"><div class="detail-label">最近出现</div><div class="detail-value">${history.last ? history.last.period + " / " + history.last.date : "从未出现"}</div></div>
            <div class="detail-item"><div class="detail-label">间隔期数</div><div class="detail-value">${history.lastIndex === -1 ? history.total : history.lastIndex}</div></div>
            <div class="detail-item"><div class="detail-label">近期 / 历史</div><div class="detail-value">${history.recent} / ${history.matched.length}</div></div>
          </div>
        </div>`;
      });
      const losingCount = plan.nums.filter(num => plan.amountMap.get(num) * odds - plan.totalInput - roundLoss < 0).length;
      renderSummary("simulateSummary", [
        { label: "总投入", value: money(plan.totalInput) },
        { label: "有效覆盖", value: plan.nums.length + "个" },
        { label: "原始注数", value: plan.rawCount + "注" },
        { label: "重复号码", value: plan.duplicates.length + "个 " + numTags(plan.duplicates) },
        { label: "重仓号码", value: plan.heavyNums.length + "个 " + numTags(plan.heavyNums) },
        { label: "最低命中收益", value: money(minReward) },
        { label: "最高命中收益", value: money(maxReward) },
        { label: "中而不赚", value: losingCount + "个" },
        { label: "回本需单号金额", value: money(requiredAmount) }
      ]);
      renderBetAdvice(plan, odds, roundLoss, targetProfit);
      document.getElementById("simulateRows").innerHTML = rows.join("");
    }

    function renderReference() {
      document.getElementById("referenceRows").innerHTML = sxOrder.map(sx => {
        const chips = zodiacMap2026[sx].map(num => {
          const ref = numberReference2026[num];
          return `<span class="number-chip ${colorClass(ref.color)}">${pad(num)} ${ref.color}</span>`;
        }).join("");
        return `<tr><td><strong>${sx}</strong></td><td>${chips}</td></tr>`;
      }).join("");
    }

    function streakKey(record, type) {
      if (type === "波色") return record.special.color;
      if (type === "生肖") return record.special.sx;
      if (type === "单双") return record.special.num % 2 ? "单" : "双";
      if (type === "大小") return record.special.num >= 25 ? "大" : "小";
      return pad(record.special.num);
    }

    function getCurrentStreak(list, type) {
      if (!list.length) return { type, key: "-", len: 0, start: "-", end: "-" };
      const key = streakKey(list[0], type);
      let len = 0;
      for (const record of list) {
        if (streakKey(record, type) !== key) break;
        len += 1;
      }
      const endRecord = list[len - 1];
      return { type, key, len, start: endRecord.date, end: list[0].date };
    }

    function getMaxStreak(list, type) {
      const asc = [...list].reverse();
      let best = { type, key: "-", len: 0, start: "-", end: "-" };
      let current = { key: null, len: 0, start: "-" };
      asc.forEach(record => {
        const key = streakKey(record, type);
        if (key === current.key) {
          current.len += 1;
        } else {
          current = { key, len: 1, start: record.date };
        }
        if (current.len > best.len) {
          best = { type, key, len: current.len, start: current.start, end: record.date };
        }
      });
      return best;
    }

    function streakValue(streak) {
      if (streak.type === "波色") return colorTag(streak.key, streak.key + "波");
      return `<span class="tag neutral">${streak.key}</span>`;
    }

    function renderStreakList(id, rows) {
      document.getElementById(id).innerHTML = rows.map(row => `
        <div class="bar-row" style="grid-template-columns:72px 1fr 92px;">
          <span>${row.type}</span>
          <span>${streakValue(row)} 连续 ${row.len} 期</span>
          <span>${row.start} 至 ${row.end}</span>
        </div>
      `).join("");
    }

    function renderStreaks() {
      const scopedRecords = getScopedRecords();
      const types = ["波色", "生肖", "单双", "大小"];
      renderStreakList("currentStreak", types.map(type => getCurrentStreak(scopedRecords, type)));
      renderStreakList("maxStreak", types.map(type => getMaxStreak(scopedRecords, type)));
    }

    function renderMonthly() {
      const scopedRecords = getScopedRecords();
      const months = [...new Set(scopedRecords.map(r => r.date.slice(0, 7)))].sort((a, b) => b.localeCompare(a));
      document.getElementById("monthlyRows").innerHTML = months.map(month => {
        const list = scopedRecords.filter(r => r.date.startsWith(month));
        const topNum = countBy(list, r => pad(r.special.num))[0] || ["-", 0];
        const topSx = countBy(list, r => r.special.sx)[0] || ["-", 0];
        const colors = countBy(list, r => r.special.color);
        const odd = list.filter(r => r.special.num % 2).length;
        const big = list.filter(r => r.special.num >= 25).length;
        return `<tr>
          <td>${month}</td>
          <td>${list.length}</td>
          <td>${topNum[0]} / ${topNum[1]}次</td>
          <td>${topSx[0]} / ${topSx[1]}次</td>
          <td>${colorTagList(colors)}</td>
          <td>单${odd} / 双${list.length - odd}</td>
          <td>大${big} / 小${list.length - big}</td>
        </tr>`;
      }).join("");
    }

    function openAdminLogin() {
      document.getElementById("adminLoginModal").classList.add("open");
      document.getElementById("adminLoginModal").setAttribute("aria-hidden", "false");
      document.getElementById("adminPassword").focus();
    }

    function closeAdminLogin() {
      document.getElementById("adminLoginModal").classList.remove("open");
      document.getElementById("adminLoginModal").setAttribute("aria-hidden", "true");
      document.getElementById("adminLoginMsg").textContent = "";
    }

    async function runSync() {
      const button = document.getElementById("updateDataBtn");
      const msg = document.getElementById("updateMsg");
      button.disabled = true;
      button.textContent = "正在抓取";
      msg.textContent = "服务端正在抓取并校验最新 2026 年记录...";
      msg.className = "footer-note";
      try {
        const result = await api("/api/admin/sync", { method: "POST", body: "{}" });
        await loadSharedRecords();
        msg.textContent = result.insertedCount
          ? `更新成功：新增 ${result.insertedCount} 条，最新 ${result.latestPeriod} 期（${result.latestDate}）。`
          : `数据已是最新：${result.latestPeriod} 期（${result.latestDate}）。`;
        msg.className = "success-text";
      } catch (error) {
        if (error.message.includes("请先输入管理员密码")) {
          adminAuthenticated = false;
          openAdminLogin();
        }
        msg.textContent = "数据更新失败：" + error.message;
        msg.className = "danger-text";
      } finally {
        button.disabled = false;
        button.textContent = "更新数据";
      }
    }

    function openAddModal() {
      document.getElementById("addModal").classList.add("open");
      document.getElementById("addModal").setAttribute("aria-hidden", "false");
      document.getElementById("period").focus();
    }

    function closeAddModal() {
      document.getElementById("addModal").classList.remove("open");
      document.getElementById("addModal").setAttribute("aria-hidden", "true");
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
        tab.classList.add("active");
        ["simulate", "basic", "dashboard", "records", "streak", "monthly", "reference"].forEach(name => {
          document.getElementById(name + "Panel").classList.toggle("hidden", tab.dataset.tab !== name);
        });
      });
    });

    document.getElementById("versionBtn").addEventListener("click", () => {
      document.getElementById("versionInfo").classList.toggle("open");
    });

    document.getElementById("updateDataBtn").addEventListener("click", () => {
      if (adminAuthenticated) runSync();
      else openAdminLogin();
    });

    document.getElementById("adminLoginForm").addEventListener("submit", async event => {
      event.preventDefault();
      const msg = document.getElementById("adminLoginMsg");
      try {
        const password = document.getElementById("adminPassword").value;
        await api("/api/admin/login", { method: "POST", body: JSON.stringify({ password }) });
        adminAuthenticated = true;
        document.getElementById("openAddModalBtn").classList.remove("hidden");
        event.target.reset();
        closeAdminLogin();
        await runSync();
      } catch (error) {
        msg.textContent = error.message;
        msg.className = "danger-text";
      }
    });

    document.getElementById("closeAdminLoginBtn").addEventListener("click", closeAdminLogin);
    document.getElementById("adminLoginModal").addEventListener("click", event => {
      if (event.target.id === "adminLoginModal") closeAdminLogin();
    });

    document.getElementById("openAddModalBtn").addEventListener("click", openAddModal);

    document.getElementById("addForm").addEventListener("submit", async event => {
      event.preventDefault();
      const msg = document.getElementById("formMsg");
      try {
        const period = periodNo(document.getElementById("period").value);
        const drawDate = document.getElementById("drawDate").value;
        const balls = document.getElementById("balls").value.split(/[，,\n]/).map(value => value.trim()).filter(Boolean);
        await api("/api/admin/records", {
          method: "POST",
          body: JSON.stringify({ year: 2026, period, drawDate, balls })
        });
        await loadSharedRecords();
        msg.textContent = `已保存：${period}期`;
        msg.className = "success-text";
        event.target.reset();
        closeAddModal();
      } catch (error) {
        msg.textContent = error.message;
        msg.className = "danger-text";
      }
    });

    document.getElementById("closeAddModalBtn").addEventListener("click", closeAddModal);
    document.getElementById("addModal").addEventListener("click", event => {
      if (event.target.id === "addModal") closeAddModal();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeAddModal();
        closeAdminLogin();
      }
    });

    document.getElementById("simulateBtn").addEventListener("click", () => {
      try {
        renderSimulation();
      } catch (error) {
        document.getElementById("simulateSummary").innerHTML = `<div class="danger-text">${error.message}</div>`;
        document.getElementById("betAdvice").innerHTML = "";
        document.getElementById("simulateRows").innerHTML = "";
      }
    });

    document.getElementById("recordSearch").addEventListener("input", renderRecords);

    document.getElementById("exportBtn").addEventListener("click", () => {
      const scopedRecords = getScopedRecords();
      const csv = ["期号,开奖时间,平一,平二,平三,平四,平五,平六,特码"]
        .concat(scopedRecords.map(r => [r.period, r.date, ...r.balls].join(",")))
        .join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "tema_records.csv";
      a.click();
      URL.revokeObjectURL(url);
    });

    async function initialize() {
      const msg = document.getElementById("updateMsg");
      try {
        await Promise.all([loadSharedRecords(), loadAdminSession()]);
        msg.textContent = "共享数据加载完成。";
        msg.className = "footer-note";
      } catch (error) {
        msg.textContent = "共享数据加载失败：" + error.message;
        msg.className = "danger-text";
      }
    }

    initialize();
  </script>
</body>
</html>
